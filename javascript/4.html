<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        const plus = (a, b) => a + b
        const minus = (a, b) => a - b
        const mul = (a, b) => a * b
        const div = (a, b) => a / b
        const mod = (a, b) => a % b
        const show = v => r.textContent = v
    </script>
</head>
<body>
    <!-- 마우스를 올리면(onmouseover) 함수가 호출된다 -->
    <button onmouseover="show(plus(4, 6))">덧셈</button>
    <button onmouseover="show(minus(4, 6))">뺄셈</button>
    <button onmouseover="show(mul(3, 4))">곱하기</button>
    <button onmouseover="show(div(8, 4))">나누기</button>
    <button onmouseover="show(mod(8, 3))">나머지</button>
    <p>결과: <span id="r"></span></p>
</body>
</html>
